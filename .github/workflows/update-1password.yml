name: Update 1Password

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-1password
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check for a new stable release
        id: update
        run: python scripts/update-1password.py

      - name: Open update pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/1password-update
          delete-branch: true
          add-paths: |
            app-admin/1password
          commit-message: >-
            app-admin/1password: bump to ${{ steps.update.outputs.version }}
          title: >-
            app-admin/1password: bump to ${{ steps.update.outputs.version }}
          body: |
            Updates 1Password from `${{ steps.update.outputs.previous_version }}`
            to `${{ steps.update.outputs.version }}`.

            The version was discovered through 1Password's official stable APT
            repository. The amd64 and arm64 artifacts were downloaded directly
            from 1Password and the Manifest hashes were regenerated.

            Generated by the `Update 1Password` workflow.

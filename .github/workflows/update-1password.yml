name: Update 1Password

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-1password
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check for a new stable release
        id: update
        run: python scripts/update-1password.py

      - name: Open update pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/1password-update
          delete-branch: true
          sign-commits: true
          draft: false
          add-paths: |
            app-admin/1password
          commit-message: >-
            app-admin/1password: bump to ${{ steps.update.outputs.version }}
          title: >-
            app-admin/1password: bump to ${{ steps.update.outputs.version }}
          body: |
            Updates 1Password from `${{ steps.update.outputs.previous_version }}`
            to `${{ steps.update.outputs.version }}`.

            The version was discovered through 1Password's official stable APT
            repository. The amd64 and arm64 artifacts were downloaded directly
            from 1Password and the Manifest hashes were regenerated.

            Generated by the `Update 1Password` workflow.

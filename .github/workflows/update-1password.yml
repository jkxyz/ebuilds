name: Update 1Password

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-1password
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      packages: read
      pull-requests: write
    container:
      image: ghcr.io/jkxyz/ebuilds-gentoo-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a new stable release
        id: release
        run: python app-admin/1password/update.py check

      - name: Bump package and regenerate Manifest
        if: steps.release.outputs.updated == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python app-admin/1password/update.py bump "$RELEASE_VERSION"

      - name: Run package QA
        if: steps.release.outputs.updated == 'true'
        run: pkgcheck scan --exit GentooCI,-NonsolvableDeps --cache-dir /tmp/pkgcheck app-admin/1password

      - name: Open update pull request
        if: steps.release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/1password-update
          delete-branch: true
          sign-commits: true
          draft: false
          add-paths: |
            app-admin/1password
          commit-message: >-
            app-admin/1password: bump to ${{ steps.release.outputs.version }}
          title: >-
            app-admin/1password: bump to ${{ steps.release.outputs.version }}
          body: |
            Updates 1Password from `${{ steps.release.outputs.previous_version }}` to `${{ steps.release.outputs.version }}`.

            The version was discovered through 1Password's official stable APT repository. `pkgbump` created the testing ebuild, `pkgdev` regenerated its Manifest, and `pkgcheck` scanned the package.

            Generated by the `Update 1Password` workflow.

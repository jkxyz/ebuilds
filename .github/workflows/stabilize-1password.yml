name: Stabilize 1Password

on:
  workflow_dispatch:
    inputs:
      version:
        description: 1Password version to stabilize
        required: true
        type: string
      amd64:
        description: Stabilize amd64
        required: true
        default: false
        type: boolean
      arm64:
        description: Stabilize arm64
        required: true
        default: false
        type: boolean

concurrency:
  group: stabilize-1password
  cancel-in-progress: false

permissions: {}

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      packages: read
      pull-requests: write
    container:
      image: ghcr.io/jkxyz/ebuilds-gentoo-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        id: inputs
        env:
          AMD64: ${{ inputs.amd64 }}
          ARM64: ${{ inputs.arm64 }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if [[ "$AMD64" != "true" && "$ARM64" != "true" ]]; then
            echo "Select at least one architecture." >&2
            exit 1
          fi
          architectures=()
          [[ "$AMD64" == "true" ]] && architectures+=(amd64)
          [[ "$ARM64" == "true" ]] && architectures+=(arm64)
          printf 'architectures=%s\n' "$(IFS=,; echo "${architectures[*]}")" >> "$GITHUB_OUTPUT"

      - name: Stabilize package and regenerate Manifest
        env:
          AMD64: ${{ inputs.amd64 }}
          ARM64: ${{ inputs.arm64 }}
          VERSION: ${{ inputs.version }}
        run: |
          arguments=()
          [[ "$AMD64" == "true" ]] && arguments+=(--arch amd64)
          [[ "$ARM64" == "true" ]] && arguments+=(--arch arm64)
          python app-admin/1password/stabilize.py "$VERSION" "${arguments[@]}"

      - name: Run package QA
        run: pkgcheck scan --exit GentooCI,-NonsolvableDeps --cache-dir /tmp/pkgcheck app-admin/1password

      - name: Open stabilization pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/1password-stabilize-${{ inputs.version }}
          delete-branch: true
          sign-commits: true
          draft: false
          add-paths: |
            app-admin/1password
          commit-message: >-
            app-admin/1password: stabilize ${{ inputs.version }} for ${{ steps.inputs.outputs.architectures }}
          title: >-
            app-admin/1password: stabilize ${{ inputs.version }} for ${{ steps.inputs.outputs.architectures }}
          body: |
            Stabilizes 1Password `${{ inputs.version }}` for `${{ steps.inputs.outputs.architectures }}`.

            `ekeyword` updated the selected architecture keywords, `pkgdev` regenerated the Manifest, and `pkgcheck` scanned the package. Older ebuilds are retained until their stable architecture coverage is fully superseded.

            Generated by the `Stabilize 1Password` workflow.

name: Publish Gentoo Tools

on:
  push:
    branches:
      - main
    paths:
      - tools/Containerfile
      - tools/gentoo.conf
      - .github/workflows/publish-gentoo-tools.yml
  workflow_dispatch:

concurrency:
  group: publish-gentoo-tools
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Gentoo tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/Containerfile
          push: true
          tags: |
            ghcr.io/jkxyz/ebuilds-gentoo-tools:latest
            ghcr.io/jkxyz/ebuilds-gentoo-tools:${{ github.sha }}
          labels: |
            org.opencontainers.image.description=Gentoo package maintenance tools for jkxyz/ebuilds
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/jkxyz/ebuilds
          provenance: mode=max

name: Update packages

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-packages
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jkxyz/ebuilds-gentoo-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Discover release-tracked packages
        id: packages
        run: echo "matrix=$(python scripts/packages_matrix.py)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    if: needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      packages: read
      pull-requests: write
    container:
      image: ghcr.io/jkxyz/ebuilds-gentoo-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bump package and regenerate Manifest
        id: release
        env:
          ATOM: ${{ matrix.atom }}
        run: scripts/bump_packages.py "$ATOM" "$("$ATOM/latest-version.py")" >> "$GITHUB_OUTPUT"

      - name: Run package QA on the generated ebuild
        if: steps.release.outputs.updated == 'true'
        env:
          ATOM: ${{ matrix.atom }}
          EBUILD: ${{ steps.release.outputs.ebuild }}
        run: pkgcheck scan --exit GentooCI,-NonsolvableDeps --cache-dir /tmp/pkgcheck "${ATOM}/${EBUILD}"

      - name: Open update pull request
        if: steps.release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/${{ matrix.slug }}-update
          delete-branch: true
          sign-commits: true
          draft: false
          add-paths: |
            ${{ matrix.atom }}
          commit-message: >-
            ${{ matrix.atom }}: bump to ${{ steps.release.outputs.version }}
          title: >-
            ${{ matrix.atom }}: bump to ${{ steps.release.outputs.version }}
          body: |
            Updates `${{ matrix.atom }}` from `${{ steps.release.outputs.previous_version }}` to `${{ steps.release.outputs.version }}`.

            The release was discovered by the package-local stable version probe. `pkgbump` created the testing ebuild and regenerated its Manifest, then `pkgcheck` scanned the generated ebuild.

            Generated by the `Update packages` workflow.
